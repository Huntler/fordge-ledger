# Production instance. On the NAS, build and run this from an SSH shell:
#
#   sudo docker compose up -d --build
#
# Set LIBRARY_PATH to wherever your designs actually live. Everything else has
# a working default, so a bare `docker compose up -d --build` also works and
# keeps the library in ./library next to this file.

services:
  forge-ledger:
    build: .
    image: forge-ledger:latest
    container_name: forge-ledger
    restart: unless-stopped
    ports:
      - "${FORGE_PORT:-8000}:8000"
    volumes:
      # The one line worth editing. On UGOS a share lives under /volume1/…
      # e.g. LIBRARY_PATH=/volume1/personal_folder/3D Druck/Custom Designs
      - "${LIBRARY_PATH:-./library}:/library"
      # SQLite cache and thumbnails. Rebuildable, but keep it on disk so a
      # restart does not trigger a full rescan of the whole library.
      - "${DATA_PATH:-./data}:/data"
    environment:
      # Optional: the LAN address of an Ollama or LM Studio box. Can also be
      # set later in the UI under Settings → Local LLM.
      FORGE_OLLAMA_URL: "${FORGE_OLLAMA_URL:-}"
      FORGE_WORKER_THREADS: "${FORGE_WORKER_THREADS:-2}"
      FORGE_FULL_RESCAN_HOUR: "${FORGE_FULL_RESCAN_HOUR:-3}"
      FORGE_FILAMENT_COST_PER_KG: "${FORGE_FILAMENT_COST_PER_KG:-22}"
      # Never seed samples into a real library.
      FORGE_DEMO_SEED: "false"
      TZ: "${TZ:-Europe/Berlin}"
      # Comment this out (or drop the forge-scad-editor service below) to
      # hide the Editor tab. The probe in state.py, not this variable, is
      # authoritative — see EXTRACTION-PROGRESS/06-compose-integration.md.
      FORGE_EDITOR_URL: "http://forge-scad-editor:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No depends_on, deliberately: the probe already handles an editor that
    # is absent, slow to start, or stopped later. Adding it would pin this
    # file to Compose >= 2.20 for `required: false` and buy nothing.

  forge-scad-editor:
    # Published by forge-scad-editor's own CI (D1 in the extraction plan) —
    # no `build:` here, unlike forge-ledger's own service above. For local
    # dev against a sibling checkout instead of a published tag, build it
    # yourself and point this at that tag, e.g.:
    #   container build -t ghcr.io/huntler/forge-scad-editor:latest ../forge-scad-editor
    image: ghcr.io/huntler/forge-scad-editor:latest
    container_name: forge-scad-editor
    restart: unless-stopped
    # No published port, deliberately: read-write access to the whole
    # library with no auth is only acceptable behind forge-ledger's own
    # /editor/ proxy, not as a second unauthenticated surface on the LAN.
    volumes:
      # MUST resolve to the same directory as forge-ledger's /library, or
      # the host's probe reports a library mismatch and hides the tab.
      - "${LIBRARY_PATH:-./library}:/library"
    environment:
      SCADED_HOST_MODE: "forge"
      SCADED_HOST_API: "http://forge-ledger:8000"
      SCADED_LIBRARY_PATH: "/library"
      TZ: "${TZ:-Europe/Berlin}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/editor/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
